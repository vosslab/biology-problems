      <rect width="460" height="440" rx="16" fill="url(#field)" stroke="#d7e0da" stroke-width="2"/>
      <path d="M34 383 H426" stroke="#b7c9bb" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(16 -7) scale(1.02)">
        <use href="#horse"/>
        <g clip-path="url(#coat-area)" fill="#fffaf0">
          <path d="M111 177 C126 163 149 160 167 169 C182 176 190 189 188 203 C186 220 171 233 155 232 C139 229 129 216 113 219 C105 210 104 190 111 177 Z"/>
          <path d="M225 238 C241 224 266 223 284 230 C301 236 309 248 306 261 L235 271 C224 263 219 250 225 238 Z"/>
          <path d="M326 100 C338 89 349 89 358 95 C349 110 344 124 338 141 C329 134 324 120 326 100 Z"/>
        </g>
      </g>
      <text x="230" y="414" font-size="25" font-weight="700" fill="#293d32">Frame-overo</text>
    </g>

    <g id="leopard-complex-panel" transform="translate(490 10)">
      <rect width="460" height="440" rx="16" fill="url(#field)" stroke="#d7e0da" stroke-width="2"/>
      <path d="M34 383 H426" stroke="#b7c9bb" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(16 -7) scale(1.02)">
        <use href="#horse"/>
        <path d="M101 174 C129 149 162 143 204 143 C242 142 269 150 292 166 C307 146 318 119 329 88 L342 61 L357 62 L369 57 L375 83 C393 88 404 99 409 112 L415 122 L398 131 L389 153 C374 164 354 165 337 153 L325 198 C327 219 324 238 312 250 C291 265 240 268 191 264 C151 260 119 247 105 227 C98 209 96 190 101 174 Z" fill="#f7f4ea"/>
