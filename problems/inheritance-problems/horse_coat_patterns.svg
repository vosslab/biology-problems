        C305 141 318 116 327 91 L337 62 L350 48 L354 70 L369 45 L373 75
        C390 79 405 91 409 106 L422 120 L411 128 L395 128 L390 150
        C376 163 355 165 337 153 L326 197 C329 218 327 237 315 250
        C293 269 240 271 190 267 C151 264 119 250 105 228
        C97 211 94 188 99 170 Z" fill="#895b3b"/>
      <path d="M289 160 C307 137 321 105 330 76 C334 64 342 59 348 58
        L344 81 C360 72 373 76 382 84 C367 84 354 92 348 105
        C334 132 326 164 316 190 Z" fill="#70482f"/>
      <path d="M339 64 L337 43 Q346 51 350 62 M369 66 L380 47 Q383 61 378 77" fill="#503323"/>
      <path d="M399 112 Q407 116 417 118 L408 124 L397 122 Z" fill="#d8bda7"/>
      <path d="M357 91 Q361 88 365 91 Q362 95 358 94 Z" fill="#211d19"/>
      <path d="M110 169 C142 146 170 141 202 142" fill="none" stroke="#d2ad80" stroke-width="5" stroke-linecap="round"/>
      <path d="M133 371 L163 371 M214 373 L245 373 M279 371 L309 371 M359 347 L383 342" fill="none" stroke="#332a24" stroke-width="5" stroke-linecap="round"/>
      <path d="M313 99 C304 116 292 133 279 145 C299 145 318 136 329 118 Z" fill="#4f3425"/>
      <path d="M53 144 C61 171 79 188 103 194" fill="none" stroke="#3c2d22" stroke-width="5" stroke-linecap="round"/>
    </g>
    <clipPath id="coat-area">
      <path d="M99 170 C121 148 154 137 203 137 C239 137 268 145 291 160 C305 141 318 116 327 91 L337 62 L350 48 L354 70 L369 45 L373 75 C390 79 405 91 409 106 L422 120 L411 128 L395 128 L390 150 C376 163 355 165 337 153 L326 197 C329 218 327 237 315 250 C293 269 240 271 190 267 C151 264 119 250 105 228 C97 211 94 188 99 170 Z"/>
    </clipPath>
  </defs>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
