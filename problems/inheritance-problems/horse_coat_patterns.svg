          <ellipse cx="177" cy="194" rx="8" ry="5"/><ellipse cx="202" cy="165" rx="6" ry="5"/>
          <ellipse cx="223" cy="207" rx="7" ry="5"/><ellipse cx="249" cy="177" rx="8" ry="5"/>
          <ellipse cx="272" cy="201" rx="6" ry="4"/><ellipse cx="292" cy="179" rx="7" ry="5"/>
          <ellipse cx="143" cy="226" rx="6" ry="5"/><ellipse cx="169" cy="244" rx="8" ry="5"/>
          <ellipse cx="194" cy="220" rx="6" ry="4"/><ellipse cx="216" cy="248" rx="7" ry="5"/>
          <ellipse cx="244" cy="226" rx="8" ry="5"/><ellipse cx="269" cy="247" rx="6" ry="4"/>
          <ellipse cx="291" cy="221" rx="7" ry="5"/><ellipse cx="308" cy="242" rx="5" ry="4"/>
          <ellipse cx="347" cy="107" rx="4" ry="3"/><ellipse cx="367" cy="121" rx="4" ry="3"/>
        </g>
      </g>
      <text x="230" y="414" font-size="25" font-weight="700" fill="#293d32">Leopard-complex</text>
