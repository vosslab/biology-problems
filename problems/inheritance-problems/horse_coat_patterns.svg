<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 460" role="img" aria-labelledby="title description">
  <title id="title">Three representative horse coat patterns</title>
  <desc id="description">Original vector illustrations of a frame-overo horse, a leopard-complex horse, and one possible Pintaloosa coat combining large white patches and spots. Coat markings vary.</desc>
  <defs>
    <linearGradient id="field" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7f4"/>
      <stop offset="1" stop-color="#e7eee8"/>
    </linearGradient>
    <g id="horse">
      <!-- Tail and legs sit behind the body. -->
      <path d="M109 186 C80 174 65 155 52 139 C57 168 67 187 89 201 C63 207 51 220 47 241 C67 224 85 217 113 215 Z" fill="#503323"/>
      <path d="M149 245 C146 281 151 312 137 350 L133 371 Q145 382 163 373 L172 350 L183 270 Z" fill="#69452d"/>
