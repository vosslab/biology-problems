          <path d="M319 96 C330 84 344 83 354 91 C346 108 340 125 335 143 C324 134 317 117 319 96 Z" fill="#fffaf0"/>
          <g fill="#453a30">
            <ellipse cx="127" cy="190" rx="6" ry="4"/><ellipse cx="150" cy="174" rx="5" ry="4"/>
            <ellipse cx="177" cy="194" rx="7" ry="4"/><ellipse cx="201" cy="169" rx="5" ry="4"/>
            <ellipse cx="221" cy="207" rx="6" ry="4"/><ellipse cx="245" cy="179" rx="7" ry="4"/>
            <ellipse cx="267" cy="204" rx="5" ry="4"/><ellipse cx="287" cy="183" rx="6" ry="4"/>
            <ellipse cx="142" cy="224" rx="5" ry="4"/><ellipse cx="165" cy="241" rx="7" ry="4"/>
            <ellipse cx="191" cy="222" rx="5" ry="4"/><ellipse cx="214" cy="245" rx="6" ry="4"/>
            <ellipse cx="243" cy="227" rx="7" ry="4"/><ellipse cx="269" cy="246" rx="5" ry="4"/>
            <ellipse cx="290" cy="223" rx="6" ry="4"/>
          </g>
        </g>
      </g>
      <text x="230" y="407" font-size="25" font-weight="700" fill="#293d32">Pintaloosa</text>
      <text x="230" y="432" font-size="18" fill="#52655a">One possible coat; markings vary</text>
    </g>
  </g>
</svg>
