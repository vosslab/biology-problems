topic: intellectual property and licensing
learning_objective: Match trademark, copyleft, copyright, and patent to what each one does.
items to match per question: 4
question override: Match each term with the right or rule it describes.
key description: term for intellectual property or licensing
keys description: terms for intellectual property or licensing
value description: description
values description: descriptions
matching pairs:
  Trademark:
  - protects the brand name on a test kit so buyers can tell who made it
  - protects a brand name or logo that identifies the source of a product
  - can stop a rival from using a logo that makes buyers mix up the two brands
  Copyleft:
  - lets a lab share its changes to a program if it gives others the same freedom to change it
  - lets people copy and change a work as long as they use the same free terms when they share it
  - keeps the same freedoms for others when someone shares a changed version of a work
  Copyright:
  - gives its owner the exclusive right to make copies of a creative work, usually for a limited time
  - protects the words and music a songwriter wrote
  - protects the drawings in a lab manual while leaving others free to explain the same science
  Patent:
  - can keep a rival from using a company's new process for making insulin without permission
  - protects a new and useful invention for a limited time
  - lets the owner stop others from making, using, or selling the invention
