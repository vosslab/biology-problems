matching pairs:
  gene addition:
  - giving airway cells a working copy of CFTR while leaving the old copy in place
  - giving tumor cells a gene for a protein that helps kill the cells
  - giving cells a working copy of the beta-globin gene for thalassemia while leaving the inherited
    copy in place
  - giving a patient's cells a working ADA gene in the lab
  genome editing:
  - using CRISPR to change one DNA letter at a chosen spot
  - removing HIV DNA that had become part of a cell's chromosome
  - fixing a change in a chromosome that causes disease
  - using a zinc-finger nuclease to change a chosen stretch of DNA
  - using a TALEN to fix a mutation at a chosen spot in a chromosome
  - using CRISPR to put a working gene at a chosen spot in a chromosome
