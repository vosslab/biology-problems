topic: US regulation of transgenic crops
learning_objective: Tell apart crop safety, food safety, and pesticide oversight in the United States.
items to match per question: 3
question override: Match each agency with its job in crop oversight.
key description: federal agency
keys description: federal agencies
value description: regulatory job
values description: regulatory jobs
matching pairs:
  USDA APHIS:
  - looks at whether a crop could harm other plants or spread a plant pest
  - checks plant health risks before allowing field tests of crops that need a permit
  - reviews possible harm to plants when certain engineered crops are moved or grown
  FDA:
  - checks that food from an engineered crop meets the same food safety standards as other foods
  - looks at food and feed questions such as allergens and nutrients in a new food crop
  - reviews food safety information when a developer seeks a consultation for a new crop variety
  EPA:
  - reviews a substance made by Bt corn to protect it from insects
  - regulates pesticide substances that some crops make to protect themselves
  - checks possible harm to other organisms from an insect-killing substance made by a crop
distractor only:
- NIH
- CDC
