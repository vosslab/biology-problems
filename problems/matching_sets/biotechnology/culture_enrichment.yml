  - takes advantage of the genetic differences between samples from two different
    areas
  - shared DNA sequences are removed to find differences between two microbial samples
  BrdU:
  - halogenated nucleotides that can be incorporated into newly synthesized DNA and
    isolated
  - a labeled nucleotide is incorporated into the DNA of actively growing bacteria
    or viruses
  - bacteria that are actively growing will take up a nucleotide analog and incorporate
    it into its DNA
