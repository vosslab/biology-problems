topic: animal cloning by somatic cell nuclear transfer
source: 'LECT10 Set #5 Djot: set5_stem_cells.djot, topic 29 (Somatic Cell Nuclear Transfer; Dolly:
  Evidence and Efficiency)'
steps:
  step 1:
  - Remove the nucleus from an unfertilized egg.
  - Take the nucleus out of an unfertilized egg.
  - Get the egg ready by removing its nucleus.
  - Remove the nucleus from an unfertilized sheep egg.
  step 2:
  - Put a nucleus from a body cell into the egg that has no nucleus.
  - Move the nucleus of a body cell into the egg whose nucleus was removed.
  - Give the egg with no nucleus a new one from a body cell.
  - Put the nucleus of an adult sheep cell into the egg with no nucleus.
  step 3:
  - Activate the egg so it starts to develop.
  - Give the egg with its new nucleus a signal to start dividing.
  - Start development in the egg that now has the donor nucleus.
  - Activate the sheep egg so it begins to divide.
  step 4:
  - Transfer the embryo to a surrogate mother.
  - Place the embryo in the animal that will carry it.
  - Move the developing embryo into a surrogate.
  - Transfer the sheep embryo to a surrogate mother.
dbsubject: Biotechnology
